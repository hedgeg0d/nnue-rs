[package]
name = "nnue-rs"
version = "0.3.1"
edition = "2021"
authors = ["hedgeg0d"]
description = "Load and evaluate NNUE chess networks (Stockfish HalfKAv2_hm, HalfKAv2 and HalfKP), with FEN and trait integration, incremental updates and AVX2"
license = "MIT"
repository = "https://github.com/hedgeg0d/nnue-rs"
homepage = "https://github.com/hedgeg0d/nnue-rs"
documentation = "https://docs.rs/nnue-rs"
readme = "README.md"
keywords = ["chess", "nnue", "stockfish", "evaluation"]
categories = ["games", "algorithms"]
exclude = ["*.nnue"]

[lib]
name = "nnue_rs"
path = "src/lib.rs"
